[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dersatlas"
version = "0.1.0"
description = "On-premise, kaynak gösteren çok dersli çalışma asistanı"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3",
  "pydantic-settings>=2,<3", "httpx>=0.27,<1", "qdrant-client>=1.13,<2",
  "pypdf>=5,<7", "python-docx>=1,<2", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
sqlserver = ["pyodbc>=5,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

